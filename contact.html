    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cvmaker.com/contact">
    <meta property="og:image" content="https://picsum.photos/seed/picsum/200/300">

    rel="canonical"
    href="https://cvmaker.com/contact">

<body>
    <header>
        <a href="home.html" class="logo">CV Makers</a>
        <nav class="navbar" aria-label="Main navigation">
            <a href="home.html" aria-current="page">Home</a>
            <a href="about.html">About</a>
            <a href="team.html">Team</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
            <a href="product.html">Product</a>
        </nav>
    </header>
    <main class="hero">
        <h2>Contact Us</h2>
        <form>

            <label for="name">Name</label><br>
            <input id="name" type="text" required><br>

            <label for="email">Email</label><br>
            <input id="email" type="email" required><br>

            <label for="phone">Phone</label><br>
            <input id="phone" type="tel"><br>

            <label for="department-choice">Department</label><br>
            <input list="department" id="department-choice">
            <datalist id="department">
                <option value="">Select a department</option>
                <option value="sales">Sales</option>
                <option value="support">Support</option>
                <option value="engineering">Engineering</option>
            </datalist><br>

            <label for="message">Message</label><br>
            <textarea id="message"></textarea><br>

            <input type="checkbox" id="newsletter"><br>
            <label for="newsletter">Subscribe</label><br>

            <button type="submit">Send Message</button>

        </form>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d8131.824611962085!2d76.2394348266424!3d11.659284984827327!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ba6097295a1d8ad%3A0xb302b72edc08e0db!2sVonnue%20Innovations%20Pvt.%20Ltd.!5e1!3m2!1sen!2sin!4v1786938007440!5m2!1sen!2sin" width="600" height="450" style="border:0;"  loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="Vonnue Innovations"></iframe>
        <address>
            CV Maker<br>
            Kochi, Kerala, India<br>
        </address>
    </main>
    <footer>
        <p>&COPY; CV makers </p>
    </footer>
</body>
